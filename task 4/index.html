<!DOCTYPE html>
<html>
<head>
    <title>Task 4 - Form Validation</title>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <button onclick="showPage('home')">Home</button>
        <button onclick="showPage('about')">About</button>
        <button onclick="showPage('contact')">Contact</button>
    </nav>

    <!-- Dynamic Page Content -->
    <div id="app"></div>

    <h1>Registration Form</h1>

    <form autocomplete="off" onsubmit="return validateForm()">

        <label>Name:</label>
        <input type="text" id="name" autocomplete="off">
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" autocomplete="off">
        <br><br>

        <label>Password:</label>
        <input type="password" id="password" autocomplete="new-password">
        <br><br>

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword" autocomplete="new-password">
        <br><br>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>


    <script>

        // Form Validation
        function validateForm() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            if (name.length < 3) {
                message.innerHTML = "Name must contain at least 3 characters.";
                return false;
            }

            if (email === "") {
                message.innerHTML = "Please enter your email.";
                return false;
            }

            if (password.length < 8) {
                message.innerHTML = "Password must contain at least 8 characters.";
                return false;
            }

            if (!/[A-Z]/.test(password)) {
                message.innerHTML = "Password must contain one uppercase letter.";
                return false;
            }

            if (!/[0-9]/.test(password)) {
                message.innerHTML = "Password must contain one number.";
                return false;
            }

            if (password !== confirmPassword) {
                message.innerHTML = "Passwords do not match.";
                return false;
            }

            message.innerHTML = "Registration successful!";

            // Dynamic DOM Manipulation
            const welcome = document.createElement("h2");
            welcome.innerHTML = "Welcome, " + name + "!";

            document.body.appendChild(welcome);

            return false;
        }


        // Client-side Routing
        function showPage(page) {

            const app = document.getElementById("app");

            if (page === "home") {

                app.innerHTML =
                    "<h2>Home Page</h2>" +
                    "<p>Welcome to my website!</p>";
            }

            if (page === "about") {

                app.innerHTML =
                    "<h2>About Page</h2>" +
                    "<p>This is my Task 4 project.</p>";
            }

            if (page === "contact") {

                app.innerHTML =
                    "<h2>Contact Page</h2>" +
                    "<p>Email: example@gmail.com</p>";
            }
        }

    </script>

</body>
</html>
